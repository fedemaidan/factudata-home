<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sorby</title>
  <style>html,body{background:#1E4469;margin:0}</style>
  <!-- ─────────────────────────────────────────────────────────────
       A/B SPLITTER · reparto de tráfico
         (A salió del test: convertía cero.)
         B  (indexB.html)  = 50%   ← "Tu obra bajo control, desde WhatsApp" (rubro rota)
         D  (indexD.html)  = 25%   ← "¿Sabés si tus obras están ganando o perdiendo?" (se escribe)
         D2 (indexD2.html) = 25%   ← misma copy que D pero estática
       - La variante se sortea una vez y se guarda en localStorage:
         el visitante que vuelve ve SIEMPRE la misma (no contamina el test).
       - Preserva utm_*/origen y agrega ?lp=<variante> para segmentar.
         (Se usa ?lp= y NO ?ab= para no pisar el A/B interno del flujo de WhatsApp.)
       - QA: forzar con  /?force=A | /?force=B | /?force=D2
       ───────────────────────────────────────────────────────────── -->
  <script>
  (function(){
    var KEY = 'sorby_lp';
    var VARIANTS = [
      { v:'B',  u:'indexB.html',  w:50 },
      { v:'D',  u:'indexD.html',  w:25 },
      { v:'D2', u:'indexD2.html', w:25 }
    ];
    function find(v){ for (var i=0;i<VARIANTS.length;i++){ if (VARIANTS[i].v===v) return VARIANTS[i]; } return null; }

    var params = new URLSearchParams(window.location.search);
    var chosen = null;

    // 1) Forzar variante (QA): ?force=A|B|D2
    var forced = (params.get('force') || '').toUpperCase();
    if (find(forced)) chosen = find(forced);

    // 2) Variante ya asignada (visitante recurrente)
    if (!chosen) {
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch(e){}
      if (find(saved)) chosen = find(saved);
    }

    // 3) Asignación nueva por peso
    if (!chosen) {
      var r = Math.random() * 100, acc = 0;
      for (var i=0;i<VARIANTS.length;i++){ acc += VARIANTS[i].w; if (r < acc){ chosen = VARIANTS[i]; break; } }
      if (!chosen) chosen = VARIANTS[0];
    }

    try { localStorage.setItem(KEY, chosen.v); } catch(e){}

    params.set('lp', chosen.v);
    params.delete('force');
    var qs = params.toString();
    window.location.replace(chosen.u + (qs ? ('?' + qs) : ''));
  })();
  </script>
</head>
<body></body>
</html>
