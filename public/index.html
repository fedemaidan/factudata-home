<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sorby</title>
  <style>html,body{background:#1E4469;margin:0}</style>
  <!-- ─────────────────────────────────────────────────────────────
       HERO FIJADO EN B (100%) · 23-jun-2026
         El A/B del hero (B vs D) se cerró. Se fija B al 100% por
         VOLUMEN DE CLICK. Decisión deliberada del equipo: va EN CONTRA
         de la lectura del 14-jun (que favorecía D por conversión real
         abajo del funnel). No es un bug.
         - Variantes perdedoras (indexD.html / indexD2.html) redirigen a /.
         - El split por ?lp= queda MUERTO. Se sigue seteando lp=B sólo
           para no romper el threading del embudo (LandingStats usa lp:).
         - Se preservan utm_*/fbclid/flow y cualquier otro query param.
           (?flow=wa|web lo lee indexB para el NUEVO A/B de flujo.)
         - QA: ?force= ya no parte tráfico (sólo existe B); se ignora.
       ───────────────────────────────────────────────────────────── -->
  <script>
  (function(){
    var DEST = 'indexB.html';
    var params = new URLSearchParams(window.location.search);

    // Limpiar localStorage del viejo splitter (por si un visitante recurrente
    // tenía D/D2 guardada) — ya no se usa para repartir.
    try { localStorage.setItem('sorby_lp', 'B'); } catch(e){}

    // Threading del embudo: el dashboard segmenta por lp. Se fija B.
    params.set('lp', 'B');
    // ?force= ya no parte tráfico (sólo existe B). Lo descartamos.
    params.delete('force');

    var qs = params.toString();
    window.location.replace(DEST + (qs ? ('?' + qs) : ''));
  })();
  </script>
</head>
<body></body>
</html>
